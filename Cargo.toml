[package]
name = "polaritha"
version = "0.1.0"
edition = "2021"
description = "Linux configurator for the AQIRYS Polaris Wired mouse and AQIRYS Talitha keyboard"
license = "MIT"
repository = "https://github.com/curxxed-mc/PolariTha"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
resvg = "0.45"
